<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_PROTOCOL // ROOT ACCESS</title>
    <style>
        /* --- HARDCORE VARIABLES --- */
        :root {
            --bg: #000000;
            --bg-panel: rgba(0, 10, 0, 0.85);
            --neon-green: #00ff41;
            --neon-red: #ff0013;
            --neon-blue: #008f11;
            --text-color: #0f0;
            --terminal-font: 'Courier New', Courier, monospace;
            --scanline-color: rgba(0, 255, 65, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-color);
            font-family: var(--terminal-font);
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 2px var(--neon-green);
            font-size: 14px;
        }

        /* --- CRT SCANLINE EFFECT --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
            animation: flicker 0.15s infinite;
        }

        /* --- MAIN LAYOUT --- */
        #main-interface {
            display: none; /* Hidden until boot finishes */
            grid-template-columns: 250px 1fr 350px;
            grid-template-rows: 50px 1fr 250px;
            height: 100vh;
            padding: 10px;
            gap: 10px;
            opacity: 0;
            transition: opacity 2s;
        }

        /* --- PANELS (Tech Borders) --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--neon-blue);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
/* Corner Brackets */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-top: 2px solid var(--neon-green);
            border-left: 2px solid var(--neon-green);
            width: 10px; height: 10px;
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            border-bottom: 2px solid var(--neon-green);
            border-right: 2px solid var(--neon-green);
            width: 10px; height: 10px;
        }

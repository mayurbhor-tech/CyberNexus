<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_PROTOCOL // ROOT ACCESS</title>
    <style>
        /* --- HARDCORE VARIABLES --- */
        :root {
            --bg: #000000;
            --bg-panel: rgba(0, 10, 0, 0.85);
            --neon-green: #00ff41;
            --neon-red: #ff0013;
            --neon-blue: #008f11;
            --text-color: #0f0;
            --terminal-font: 'Courier New', Courier, monospace;
            --scanline-color: rgba(0, 255, 65, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-color);
            font-family: var(--terminal-font);
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 2px var(--neon-green);
            font-size: 14px;
        }

        /* --- CRT SCANLINE EFFECT --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
            animation: flicker 0.15s infinite;
        }

        /* --- MAIN LAYOUT --- */
        #main-interface {
            display: none; /* Hidden until boot finishes */
            grid-template-columns: 250px 1fr 350px;
            grid-template-rows: 50px 1fr 250px;
            height: 100vh;
            padding: 10px;
            gap: 10px;
            opacity: 0;
            transition: opacity 2s;
        }

        /* --- PANELS (Tech Borders) --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--neon-blue);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
/* Corner Brackets */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-top: 2px solid var(--neon-green);
            border-left: 2px solid var(--neon-green);
            width: 10px; height: 10px;
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            border-bottom: 2px solid var(--neon-green);
            border-right: 2px solid var(--neon-green);
            width: 10px; height: 10px;
        }
.panel-content {
            flex: 1;
            overflow: auto;
            padding: 10px;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            grid-row: 1 / -1;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 20px;
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px dashed var(--neon-green);
            margin-bottom: 10px;
            animation: glitch 1s infinite alternate-reverse;
        }
.menu-item {
            padding: 12px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: 0.2s;
        }
        .menu-item:hover, .menu-item.active {
            background: rgba(0, 255, 65, 0.1);
            border-left: 2px solid var(--neon-green);
            padding-left: 20px;
        }
/* --- TOP BAR --- */
        .topbar {
            grid-column: 2 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- TERMINAL (CLI) --- */
        #terminal-output {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 10px;
        }
 .cmd-line { display: flex; }
        .prompt { color: var(--neon-green); margin-right: 8px; }
        #cmd-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            flex: 1;
            outline: none;
        }

        /* --- HEX DUMP SNIFFER --- */
        .hex-row {
            display: flex;
            font-size: 11px;
            margin-bottom: 2px;
            color: #888;
}
        .hex-offset { color: var(--neon-blue); margin-right: 10px; }
        .hex-code { color: #fff; margin-right: 15px; letter-spacing: 1px; }
        .hex-ascii { color: var(--neon-green); }

        /* --- PROCESS HACKER --- */
        .proc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .proc-table th { text-align: left; border-bottom: 1px solid var(--neon-blue); padding: 5px; color: var(--neon-blue); }
        .proc-table td { padding: 3px; }
        .proc-high { color: var(--neon-red); text-shadow: 0 0 5px red; }

        /* --- GLITCH TEXT --- */
        .glitch-text {
            position: relative;
        }
.glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch-text::before {
            left: 2px; text-shadow: -1px 0 red; clip-path: inset(44% 0 61% 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px; text-shadow: -1px 0 blue; clip-path: inset(10% 0 86% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            100% { clip-path: inset(10% 0 50% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(80% 0 5% 0); }
            100% { clip-path: inset(30% 0 10% 0); }
        }

        /* --- GRID AREAS --- */
        .area-main { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .area-bottom { grid-column: 2; grid-row: 3; }
        .area-right { grid-column: 3; grid-row: 2 / -1; }

        /* --- CHARTS --- */
        canvas { width: 100%; height: 100%; }
         </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <!-- 1. BOOT SEQUENCE OVERLAY -->
    <div id="boot-screen"></div>

    <!-- 2. MAIN INTERFACE -->
    <div id="main-interface">
        
        <!-- SIDEBAR -->
        <aside class="sidebar panel">
            <div class="brand glitch-text" data-text="GHOST_PROTOCOL">GHOST_PROTOCOL</div>
            <div class="menu-item active" onclick="switchTab(this, 'dash')">> DASHBOARD</div>
            <div class="menu-item" onclick="switchTab(this, 'term')">> TERMINAL_CLI</div>
            <div class="menu-item" onclick="switchTab(this, 'sniff')">> PACKET_SNIFFER</div>
            <div class="menu-item" onclick="switchTab(this, 'proc')">> PROCESS_HACKER</div>
            <div class="menu-item" onclick="switchTab(this, 'hack')">> ACTIVE_ATTACKS</div>
            
            <div style="margin-top: auto; padding: 20px; border-top: 1px dashed #008f11;">
                <div style="margin-bottom: 5px;">NET_ID: <span class="text-red">ANONYMOUS</span></div>
                <div style="margin-bottom: 5px;">VPN: <span class="text-green">CONNECTED [TOR]</span></div>
                <div style="margin-bottom: 5px;">ENCRYPTION: <span class="text-green">AES-256</span></div>
                <button class="btn" style="width:100%; background:red; color:black; border:none; font-weight:bold; margin-top:10px;" onclick="location.reload()">ABORT</button>
            </div>
        </aside>
